[project]
name = "wwb"
version = "0.1.0"
description = "Host API for the wwb_timer ESP32-C3 device"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
image = ["pillow"]

[project.scripts]
wwb = "wwb.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
