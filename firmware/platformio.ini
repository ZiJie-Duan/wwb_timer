[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = /dev/ttyACM0
build_unflags = -Os
; 脱机程序：native/ 里的框架与程序，和网页模拟器用的是同一份源码
build_src_filter = +<*> +<../../native/wwb/*.cpp> +<../../native/timer/*.cpp>
build_flags =
    -O2
    -I../native
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2
